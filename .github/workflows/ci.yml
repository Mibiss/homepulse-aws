name: Continuous Integration

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile Python files
        run: |
          python -m py_compile agent.py
          python -m py_compile cloud/lambda/lambda_function.py

      - name: Run unit tests
        run: |
          pytest tests/unit -v

  terraform-validation:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: |
          terraform fmt -check -diff -recursive infrastructure

      - name: Initialize main Terraform configuration
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -input=false

      - name: Initialize bootstrap Terraform configuration
        working-directory: infrastructure/bootstrap/state-backend
        run: |
            terraform init -backend=false -input=false

      - name: Initialize GitHub OIDC Terraform configuration
        working-directory: infrastructure/bootstrap/github-oidc
        run: |
          terraform init -backend=false -input=false

      - name: Run Terraform integration tests
        run: |
          pytest tests/integration/test_terraform_configuration.py -v

  full-test-suite:
    name: Full test suite
    runs-on: ubuntu-latest
    needs:
      - python-tests
      - terraform-validation

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Initialize Terraform configurations
        run: |
          terraform -chdir=infrastructure/terraform init \
            -backend=false \
            -input=false

          terraform -chdir=infrastructure/bootstrap/state-backend init \
            -backend=false \
            -input=false

          terraform -chdir=infrastructure/bootstrap/github-oidc init \
            -backend=false \
            -input=false

      - name: Run all tests with coverage
        run: |
          pytest -v \
            --cov=agent \
            --cov=cloud/lambda \
            --cov-report=term-missing